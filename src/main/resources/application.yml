spring:
  application:
    name: ecommerce

  # ===============================
  # Database Configuration
  # ===============================
  datasource:
    url: jdbc:mysql://localhost:3306/employee
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===============================
  # JPA / Hibernate Configuration
  # ===============================
  jpa:
    hibernate:
      # Create tables when application starts
      # Drop tables when application stops
      ddl-auto: create-drop

    # Show SQL generated by Hibernate
    show-sql: true

    properties:
      hibernate:
        # Format SQL for readability
        format_sql: true

        # MySQL dialect
        # dialect: org.hibernate.dialect.MySQLDialect

    # Recommended
    open-in-view: false


# ===============================
# Server Configuration
# ===============================
server:
  port: 8081


# ===============================
# Actuator Configuration
# ===============================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,beans


# ===============================
# Hibernate SQL Logging
# ===============================
logging:
  level:
    # Show SQL statements generated by Hibernate
    org.hibernate.SQL: DEBUG

    # Show actual parameter values
    org.hibernate.orm.jdbc.bind: TRACE
